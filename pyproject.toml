[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recallgraph"
version = "0.1.0"
description = "Evidence-first personal multimodal memory, local prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "python-multipart==0.0.32",
  "httpx==0.28.1", "pypdf==6.10.0", "tzdata>=2025.1", "python-dotenv==1.2.4", "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

